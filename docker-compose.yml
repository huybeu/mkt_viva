services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://content:content_password@db:5432/content_team?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: content-team
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-contentadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mkt-viva.rule=Host(`vivatravel.group`) || Host(`www.vivatravel.group`)"
      - "traefik.http.routers.mkt-viva.entrypoints=websecure"
      - "traefik.http.routers.mkt-viva.tls=true"
      - "traefik.http.routers.mkt-viva.tls.certresolver=letsencrypt"
      - "traefik.http.services.mkt-viva.loadbalancer.server.port=3000"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_team
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content_team"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-contentadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mkt-viva-storage.rule=Host(`vivatravel.group`) && PathPrefix(`/content-team`)"
      - "traefik.http.routers.mkt-viva-storage.entrypoints=websecure"
      - "traefik.http.routers.mkt-viva-storage.tls=true"
      - "traefik.http.routers.mkt-viva-storage.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mkt-viva-storage.priority=100"
      - "traefik.http.services.mkt-viva-storage.loadbalancer.server.port=9000"
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/content-team;
      mc anonymous set download local/content-team"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-contentadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
